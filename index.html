    <!-- Prevent theme flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('whatscode-theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      html { background-color: #0f1512; }
      html.dark { background-color: #0f1512; }
      html:not(.dark) { background-color: #fafafa; }
